[package]
name = "indigo-core"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/indigo-hub",
    "crates/indigo-node",
    "crates/indigo-common",
]
resolver = "2"

[dependencies]
axum = "0.8.8"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
tonic = "0.14.2"
tracing = "0.1.44"