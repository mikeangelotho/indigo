[package]
name = "indigo-node"
version = "0.1.0"
edition = "2021"

[dependencies]
indigo-common = { path = "../indigo-common" }
tonic = "0.12"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.8"
tower = "0.5"
tower-http = "0.6"

# ML / Inference
llama-cpp-2 = { version = "0.1.34", features = ['cuda'] }
hf-hub = "0.4.1"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
glob = "0.3.3"
regex = "1.12.2"
