[package]
name = "indigo-hub"
version = "0.1.0"
edition = "2021"

[dependencies]
indigo-common = { path = "../indigo-common" }
axum = { version = "0.7", features = ["ws"] }
futures = "0.3"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.4"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tonic = "0.12"
tokio-stream = "0.1"
async-stream = "0.3"
prost = "0.13"
uuid = { version = "1.0", features = ["v4"] }
rand = "0.9.2"
chrono = "0.4.42"
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
reqwest = { version = "0.12", features = ["json"] }
wasmtime = { version = "26.0", optional = true, features = ["async"] }
wasmtime-wasi = { version = "26.0", optional = true }
anyhow = "1.0"
glob = "0.3.3"
urlencoding = "2.1"
# MCP dependencies
async-trait = "0.1"

[features]
default = []
wasm = ["wasmtime", "wasmtime-wasi"]
